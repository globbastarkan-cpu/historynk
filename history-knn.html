<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8B0000">
<title>История КНН — колледж нефтехимии</title>
<style>
:root{
  --burgundy:#8B0000; --yellow:#f4e400;
  --dark:#1b1f24; --card:#22282f; --card-2:#2b323a;
  --line:rgba(255,255,255,.12); --text:#f4f6f8; --muted:#aab3bb;
  --radius:20px; --gap:clamp(14px,2.5vw,22px); --maxw:1080px;
  --accent:var(--burgundy);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;color:var(--text);line-height:1.6;background-color:var(--dark);background-image:linear-gradient(180deg,#1b1f24,#242a31 50%,#2c333b);background-attachment:fixed;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
.progress-bar{position:fixed;top:0;left:0;height:4px;width:0%;background:linear-gradient(90deg,var(--yellow),var(--burgundy));z-index:1000;transition:width .12s linear;}

header{
  position:relative;min-height:clamp(240px,46vh,440px);
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:clamp(2rem,6vw,3.5rem) 1rem;
  padding-top:calc(clamp(2rem,6vw,3.5rem) + env(safe-area-inset-top));
  background-color:#2a0b0b;
  background-image:
    linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.34)),
    url('knn-hero.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden;
}
header::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%);
  pointer-events:none;
}
header h1{
  position:relative;z-index:1;
  font-size:clamp(1.5rem,6vw,2.6rem);line-height:1.15;font-weight:800;
  padding:.5em .8em;border-radius:18px;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,.15) 70%, transparent 100%);
  text-shadow:0 2px 12px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9);
  color:#fff;
}
header h1 small{display:block;font-size:.5em;font-weight:400;opacity:.95;margin-top:.4rem;letter-spacing:.5px;}

section{width:100%;max-width:var(--maxw);margin:0 auto;padding:clamp(1.2rem,4vw,2.6rem) clamp(.9rem,4vw,1.4rem);}
h2{color:var(--yellow);font-size:clamp(1.15rem,4.5vw,1.65rem);margin:0 0 .9rem;padding-left:.7rem;border-left:5px solid var(--accent);line-height:1.25;}
h2:not(:first-child){margin-top:clamp(1.6rem,4vw,2.4rem);}
.about-card{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background-color:#1a0808;background-image:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.82)), url('knn-about.jpg');background-size:cover;background-position:center;min-height:220px;display:flex;align-items:flex-end;}
.about-card p{position:relative;z-index:1;padding:clamp(1rem,4vw,1.4rem);font-size:clamp(.92rem,2.6vw,1rem);color:#f0eaea;text-shadow:0 1px 4px rgba(0,0,0,.85);}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap);background:radial-gradient(circle at 10% 10%, rgba(139,0,0,.18), transparent 40%), radial-gradient(circle at 90% 90%, rgba(244,228,0,.06), transparent 40%);padding:var(--gap);border-radius:var(--radius);}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem .85rem;text-align:center;cursor:pointer;transition:transform .25s,border-color .25s,background .25s;user-select:none;-webkit-tap-highlight-color:transparent;}
.stat-card:hover{transform:translateY(-3px);border-color:var(--yellow);background:var(--card-2);}
.stat-card:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;}
.stat-card.active{border-color:var(--yellow);background:var(--card-2);}
.stat-value{font-size:clamp(1.45rem,5.5vw,2.05rem);font-weight:800;color:var(--yellow);line-height:1.1;letter-spacing:.5px;}
.stat-label{font-size:clamp(.74rem,2.4vw,.84rem);color:var(--muted);margin-top:.35rem;}
.stat-more{display:inline-block;margin-top:.55rem;font-size:.72rem;color:var(--accent);font-weight:700;opacity:.95;}
.stat-detail{grid-column:1/-1;background:var(--card-2);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:var(--radius);padding:0 1rem;max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .3s,padding .3s;font-size:clamp(.88rem,2.5vw,.96rem);color:#e7ebee;}
.stat-detail.open{max-height:460px;opacity:1;padding:1rem;}
.stat-detail strong{color:var(--yellow);}
.exports-block{border-radius:var(--radius);padding:clamp(.9rem,3vw,1.3rem);border:1px solid var(--line);background:linear-gradient(135deg, rgba(139,0,0,.22), rgba(0,0,0,.15)), var(--card);}
.dir-grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:.6rem;}
.dir-card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;border-top:3px solid var(--accent);}
.dir-card h3{font-size:1rem;color:var(--yellow);margin-bottom:.4rem;}
.dir-card p{font-size:.88rem;color:#d6dce0;}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem;}
.tag{background:rgba(139,0,0,.25);border:1px solid rgba(139,0,0,.6);color:#f2d6d6;padding:.4rem .75rem;border-radius:999px;font-size:clamp(.74rem,2.4vw,.82rem);font-weight:600;}
.timeline-wrap{overflow-x:auto;padding:14px 0 18px;margin:0 -4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
.timeline-horizontal{display:flex;gap:clamp(22px,5vw,42px);position:relative;padding:16px 18px;min-width:max-content;}
.timeline-horizontal::before{content:"";position:absolute;top:30px;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--burgundy),var(--yellow));transform:translateY(-50%);z-index:0;opacity:.5;}
.timeline-dot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;min-width:92px;background:none;border:none;color:var(--text);font-family:inherit;-webkit-tap-highlight-color:transparent;}
.timeline-dot .dot{width:22px;height:22px;border-radius:50%;background:#3a3a3a;border:3px solid #5a5a5a;transition:.3s;}
.timeline-dot.active .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 14px var(--yellow);transform:scale(1.18);}
